name: Docomo collector checks
on:
  push:
    paths:
      - 'services/docomo-sync/**'
      - '.github/workflows/docomo-check.yml'
  pull_request:
    paths:
      - 'services/docomo-sync/**'
      - '.github/workflows/docomo-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/docomo-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/docomo-sync/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run dry-run
